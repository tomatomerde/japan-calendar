name: Update holiday data

# Fetches the Cabinet Office's syukujitsu.csv and regenerates src/data/official.ts.
#
# The dev environment's egress policy blocks cao.go.jp, so fetching the
# official data happens in this workflow instead (an Actions runner with
# external network access).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to push the diff'
        type: choice
        required: true
        default: branch
        options:
          - branch # push to the chore/update-holiday-data branch (open a PR separately)
          - main   # push directly to main (for initial bootstrapping)
  schedule:
    # Monthly, on the 1st at 06:00 JST. The Calendrical Data is published
    # in early February each year, so monthly is frequent enough.
    - cron: '0 21 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-holiday-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Fetch the Cabinet Office CSV and regenerate src/data/official.ts
        id: fetch
        run: |
          node scripts/fetch-syukujitsu.ts | tee /tmp/report.txt

      - name: Write the report to the job summary
        if: always()
        run: |
          {
            echo '## syukujitsu.csv parse results'
            echo
            echo '```'
            cat /tmp/report.txt || echo '(no report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether anything changed
        id: diff
        run: |
          if git diff --quiet -- src/data/official.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in official data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- src/data/official.ts
          fi

      # Runs the suite -- most importantly officialMatch.test.ts -- against
      # the freshly regenerated data, before anything gets pushed. This is
      # the only thing standing between a bad or unexpected CSV (a new
      # holiday name format, a corrupted fetch, ...) and main; the PR
      # opened below still goes through the normal pull_request CI, but by
      # then the bad data would already be sitting on a pushed branch.
      #
      # `npm run test:data` excludes test/performance.test.ts (see
      # package.json): it asserts on wall-clock timing, which depends on
      # the runner's hardware/load, not on the data being updated here. A
      # slow runner shouldn't be able to block a routine data update; that
      # assertion still runs on every push/PR via CI (ci.yml)'s `npm test`.
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Test the regenerated data against the rule engine
        if: steps.diff.outputs.changed == 'true'
        run: npm run test:data

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          TARGET: ${{ github.event_name == 'schedule' && 'branch' || inputs.target }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/official.ts
          git commit -m 'chore(data): update official holiday data from the Cabinet Office syukujitsu.csv

          Source: Cabinet Office, "National Holidays" (CC BY 4.0)
          Generated by: node scripts/fetch-syukujitsu.ts'

          if [ "$TARGET" = "main" ]; then
            git push origin HEAD:main
          else
            # actions/checkout's default fetch-depth:1 leaves no remote-tracking
            # ref for this branch, so --force-with-lease can't verify a lease
            # and rejects the push as "stale info" on every run after the
            # first. This branch only ever holds bot-regenerated data with no
            # human commits to protect, so a plain --force is both safe and
            # required here.
            git push --force origin HEAD:refs/heads/chore/update-holiday-data
          fi

      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.target == 'branch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --head chore/update-holiday-data --state open --json number --jq '. | length' | grep -qx 0; then
            gh pr create \
              --head chore/update-holiday-data \
              --base main \
              --title 'chore(data): update official holiday data' \
              --body "Automated update from the Cabinet Office's \`syukujitsu.csv\`. See the workflow run's job summary for the parse report."
          else
            echo "An open PR for chore/update-holiday-data already exists; the push above updated it." >> "$GITHUB_STEP_SUMMARY"
          fi
