name: Update holiday data

# 内閣府 syukujitsu.csv を取得して src/data/official.ts を再生成する。
#
# 開発環境からは cao.go.jp が egress ポリシーで遮断されているため、
# 公式データの取得はこのワークフロー（外部ネット疎通のある Actions ランナー）で行う。

on:
  workflow_dispatch:
    inputs:
      target:
        description: '差分の反映先'
        type: choice
        required: true
        default: branch
        options:
          - branch # chore/update-holiday-data ブランチに push（PRは別途作る）
          - main   # main に直接 push（初回ブートストラップ用）
  schedule:
    # 毎月1日 06:00 JST。暦要項の公表は毎年2月上旬なので月次で十分。
    - cron: '0 21 1 * *'

permissions:
  contents: write

concurrency:
  group: update-holiday-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 内閣府CSVを取得して src/data/official.ts を再生成
        id: fetch
        run: |
          node scripts/fetch-syukujitsu.ts | tee /tmp/report.txt

      - name: レポートをジョブサマリに出す
        if: always()
        run: |
          {
            echo '## syukujitsu.csv パース結果'
            echo
            echo '```'
            cat /tmp/report.txt || echo '(レポートなし)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 差分の有無を確認
        id: diff
        run: |
          if git diff --quiet -- src/data/official.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "公式データに変更なし。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- src/data/official.ts
          fi

      - name: コミットして push
        if: steps.diff.outputs.changed == 'true'
        env:
          TARGET: ${{ github.event_name == 'schedule' && 'branch' || inputs.target }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/official.ts
          git commit -m 'chore(data): 内閣府 syukujitsu.csv から公式祝日データを更新

          出典: 内閣府「国民の祝日について」(CC BY 4.0)
          生成: node scripts/fetch-syukujitsu.ts'

          if [ "$TARGET" = "main" ]; then
            git push origin HEAD:main
          else
            git push --force-with-lease origin HEAD:refs/heads/chore/update-holiday-data
            echo "chore/update-holiday-data に push した。PR を作成すること。" >> "$GITHUB_STEP_SUMMARY"
          fi
