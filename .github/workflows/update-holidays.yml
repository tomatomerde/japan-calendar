name: Update holiday data

# Fetches the Cabinet Office's syukujitsu.csv and regenerates src/data/official.ts.
#
# The dev environment's egress policy blocks cao.go.jp, so fetching the
# official data happens in this workflow instead (an Actions runner with
# external network access).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to push the diff'
        type: choice
        required: true
        default: branch
        options:
          - branch # push to the chore/update-holiday-data branch (open a PR separately)
          - main   # push directly to main (for initial bootstrapping)
  schedule:
    # Monthly: the 1st at 21:00 UTC, which is the 2nd at 06:00 JST. Cron is
    # evaluated in UTC and the +09:00 conversion crosses midnight, so the
    # day-of-month field names the day *before* the intended JST day. The
    # Calendrical Data is published in early February each year, so monthly
    # is frequent enough either way.
    - cron: '0 21 1 * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-holiday-data
  cancel-in-progress: false

# GitHub's implicit shell for `run` on Linux is `bash -e {0}` -- which has
# no `pipefail`, so in `a | b` only b's exit status counts. That silently
# discarded the fetch script's exit code below, meaning every sanity check
# it performs (row counts, anomalies, the shrink guard) could fail while
# this workflow reported success and quietly did nothing. Naming the shell
# explicitly opts into `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Fetch the Cabinet Office CSV and regenerate src/data/official.ts
        id: fetch
        run: |
          node scripts/fetch-syukujitsu.ts | tee /tmp/report.txt

      - name: Write the report to the job summary
        if: always()
        run: |
          {
            echo '## syukujitsu.csv parse results'
            echo
            echo '```'
            cat /tmp/report.txt || echo '(no report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check whether anything changed
        id: diff
        run: |
          if git diff --quiet -- src/data/official.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No change in official data."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- src/data/official.ts
          fi

      # Runs the suite -- most importantly officialMatch.test.ts -- against
      # the freshly regenerated data, before anything gets pushed. This is
      # the only thing standing between a bad or unexpected CSV (a new
      # holiday name format, a corrupted fetch, ...) and main; the PR
      # opened below still goes through the normal pull_request CI, but by
      # then the bad data would already be sitting on a pushed branch.
      #
      # `npm run test:data` excludes test/performance.test.ts (see
      # package.json): it asserts on wall-clock timing, which depends on
      # the runner's hardware/load, not on the data being updated here. A
      # slow runner shouldn't be able to block a routine data update; that
      # assertion still runs on every push/PR via CI (ci.yml)'s `npm test`.
      - name: Install dependencies
        if: steps.diff.outputs.changed == 'true'
        run: npm ci

      - name: Test the regenerated data against the rule engine
        if: steps.diff.outputs.changed == 'true'
        run: npm run test:data

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        env:
          TARGET: ${{ github.event_name == 'schedule' && 'branch' || inputs.target }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/official.ts
          git commit -m 'chore(data): update official holiday data from the Cabinet Office syukujitsu.csv

          Source: Cabinet Office, "National Holidays" (CC BY 4.0)
          Generated by: node scripts/fetch-syukujitsu.ts'

          if [ "$TARGET" = "main" ]; then
            git push origin HEAD:main
          else
            # actions/checkout's default fetch-depth:1 leaves no remote-tracking
            # ref for this branch, so --force-with-lease can't verify a lease
            # and rejects the push as "stale info" on every run after the
            # first. This branch only ever holds bot-regenerated data with no
            # human commits to protect, so a plain --force is both safe and
            # required here.
            git push --force origin HEAD:refs/heads/chore/update-holiday-data
          fi

      # By this point the regenerated data is already pushed to the branch, so
      # the update itself has succeeded. Only the pull request may be missing.
      #
      # It probably will be: this repository has "Allow GitHub Actions to
      # create and approve pull requests" turned off (the GitHub default,
      # confirmed false on 2026-08-10), and with it off GITHUB_TOKEN cannot
      # open one --
      #   GraphQL: GitHub Actions is not permitted to create or approve pull requests
      # Failing here would report a successful data update as a failed run, on
      # a monthly schedule nobody is watching. So: try anyway (flipping that
      # setting makes this start working with no edit here), and if the refusal
      # is that specific one, degrade to a warning carrying the link that opens
      # the pull request by hand. Any other failure is still a failure.
      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.target == 'branch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...chore/update-holiday-data?expand=1"

          # Materialised, not piped. `gh pr list ... | grep -q` puts an
          # early-exiting reader after a pipe, and `defaults.run.shell: bash`
          # above turns on `pipefail` -- so the producer dying of SIGPIPE would
          # fail this step precisely when the grep matched. Verified: the same
          # pipeline exits 141 once the producer's output outgrows the 64KB
          # pipe buffer. Today's output is one line, which is the only reason
          # the old form was not already failing.
          #
          # gh can also fail here for reasons that have nothing to do with this
          # repository -- an API rate limit is the one that has actually
          # happened, three times, on the repository that distributes this
          # workflow's sibling. Under `set -e` that would abort with a log that
          # never mentions the branch now sitting there with the regenerated
          # data on it, which reads as "the update did not run". It did. Name
          # the branch and carry the link on this path too, not just on the
          # permissions one below.
          if ! open_count=$(gh pr list --head chore/update-holiday-data --state open --json number --jq 'length' 2>&1); then
            # $open_count holds gh's error text on this path, not a count.
            echo "$open_count"
            echo "::error::The holiday data was regenerated and pushed to chore/update-holiday-data, but checking for an existing pull request failed (see the gh output above; an API rate limit clears on its own). Nothing is lost -- open the pull request here: $url"
            exit 1
          fi

          if [ "$open_count" -gt 0 ]; then
            echo "An open PR for chore/update-holiday-data already exists; the push above updated it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if create_output=$(gh pr create \
            --head chore/update-holiday-data \
            --base main \
            --title 'chore(data): update official holiday data' \
            --body "Automated update from the Cabinet Office's \`syukujitsu.csv\`. See the workflow run's job summary for the parse report." 2>&1); then
            echo "$create_output"
            exit 0
          fi
          echo "$create_output"

          case "$create_output" in
            *"not permitted to create or approve pull requests"*)
              echo "::warning::The holiday data was regenerated and pushed to chore/update-holiday-data, but GitHub Actions is not allowed to open the pull request on this repository. Nothing is lost -- open it here: $url  (To make this automatic, enable Settings -> Actions -> General -> Allow GitHub Actions to create and approve pull requests.)"
              {
                echo '## Pull request not opened'
                echo
                echo 'The regenerated data is pushed to `chore/update-holiday-data`, but this'
                echo 'repository does not allow GitHub Actions to create pull requests, so the'
                echo 'last step could not be automated.'
                echo
                echo "**[Open the pull request]($url)**"
                echo
                echo 'To make it automatic: Settings -> Actions -> General -> Workflow permissions'
                echo '-> "Allow GitHub Actions to create and approve pull requests".'
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::gh pr create failed for a reason other than the Actions pull-request restriction. The branch chore/update-holiday-data is pushed, so the data update itself succeeded; only the pull request is missing. See the output above, and open it by hand here: $url"
              exit 1
              ;;
          esac
