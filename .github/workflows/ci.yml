name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All date arithmetic is fixed to JST, so the result should never
        # depend on the process's timezone. Includes both sides of the
        # date line (UTC+14 and UTC-11).
        timezone:
          - Asia/Tokyo
          - UTC
          - Pacific/Kiritimati
          - Pacific/Midway
    name: test (TZ=${{ matrix.timezone }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TZ: ${{ matrix.timezone }}
