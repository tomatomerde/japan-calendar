version: 2

# Monthly and grouped on purpose. A solo maintainer merges these by hand, so
# the cost of an update is the review, not the version bump; weekly ungrouped
# updates turn into a queue nobody reads.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']

  # npm version updates are switched off on purpose (2026-10-01). Every
  # devDependency here is build or test tooling: the published package has
  # zero runtime dependencies, so a bump changes nothing a user installs. The
  # monthly bumps so far (#46, #60, #61) each passed CI and cost the
  # maintainer a review request for no user-visible gain. The library is in maintenance-only mode, so the
  # toolchain is brought up to date by whoever next does real work on it,
  # in the same pull request.
  #
  # Security is not covered by this file and is unaffected: GitHub's
  # vulnerability alerts and Dependabot security updates are repository
  # settings, and keep firing for npm without an entry here.
  #
  # When re-enabling, keep it monthly, grouped, minor/patch only, and keep the
  # comparison targets of test/alternatives.test.ts (japanese-holidays,
  # @types/japanese-holidays, @holiday-jp/holiday_jp, date-holidays,
  # @gahojin-inc/holiday-japanese, @smarthr/wareki) frozen: they are the
  # baseline of a measurement, not dependencies. Majors (TypeScript 7,
  # @types/node 26, ...) are migrations to schedule, recorded in
  # dev-standards' NOTES.md.
