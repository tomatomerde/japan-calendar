version: 2

# Monthly and grouped on purpose. A solo maintainer merges these by hand, so
# the cost of an update is the review, not the version bump; weekly ungrouped
# updates turn into a queue nobody reads.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    # Minor and patch only, and majors are not proposed at all. This is a
    # deliberate silence, not an oversight: the first grouped run bundled
    # TypeScript 5.9 -> 7.0, @types/node 22 -> 26 and vitest 2 -> 4 into one
    # pull request that failed CI outright. Those are migrations to schedule,
    # not updates to merge, and a permanently red dependency pull request
    # teaches you to ignore dependency pull requests. The majors are recorded
    # in dev-standards' NOTES.md; drop the ignore block to see them here again.
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
      # The comparison targets of test/alternatives.test.ts, frozen on
      # purpose. They are not dependencies of anything that ships; they are
      # the other half of a measurement, and a measurement whose baseline
      # moves on a schedule is not one. When one of them changes behaviour
      # the right response is to re-read the README section it backs, which
      # is a documentation task to pick up deliberately -- not a red pull
      # request arriving on the first of the month.
      - dependency-name: 'japanese-holidays'
      - dependency-name: '@types/japanese-holidays'
      - dependency-name: '@holiday-jp/holiday_jp'
      - dependency-name: 'date-holidays'
      - dependency-name: '@gahojin-inc/holiday-japanese'
      - dependency-name: '@smarthr/wareki'
